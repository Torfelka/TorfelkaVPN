<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Torfelka VPN — Закрыт</title>
<meta name="theme-color" content="#0a0a0f">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230a0a0f'/%3E%3Cpath d='M32 8 L50 15 V31 C50 43 42 52 32 56 C22 52 14 43 14 31 V15 Z' fill='%23555560'/%3E%3Ctext x='32' y='41' font-family='Arial' font-size='26' font-weight='bold' fill='%23ffffff' text-anchor='middle'%3ET%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}

html,body{
  height:100%;
  overflow:hidden;
}

body{
  background:#0a0a0f;
  color:#f4f4f7;
  font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  position:relative;
  -webkit-font-smoothing:antialiased;
}

/* Мягкое фиолетовое свечение на фоне */
body::before{
  content:'';
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(600px 400px at 50% 40%, rgba(124,92,255,.14), transparent 70%),
    radial-gradient(500px 400px at 50% 100%, rgba(124,92,255,.08), transparent 70%);
  animation:fadeIn 1.6s ease .1s both;
}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}

.box{
  position:relative;
  z-index:1;
  text-align:center;
  max-width:640px;
  animation:rise 1s cubic-bezier(.2,.8,.3,1) both;
}
@keyframes rise{
  from{opacity:0;transform:translateY(24px);}
  to{opacity:1;transform:translateY(0);}
}

.icon{
  width:82px;
  height:82px;
  margin:0 auto 30px;
  border-radius:26px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#1a1a24,#0f0f16);
  border:1px solid rgba(255,255,255,.08);
  color:#6a6a78;
  box-shadow:0 20px 50px rgba(0,0,0,.55);
  animation:pulse 4s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{transform:scale(1);}
  50%{transform:scale(1.04);}
}

.icon svg{
  width:38px;
  height:38px;
  stroke:#8a8a98;
  stroke-width:2.2;
  fill:none;
  stroke-linecap:round;
  stroke-linejoin:round;
}

h1{
  font-size:clamp(34px,7vw,60px);
  font-weight:800;
  letter-spacing:-2px;
  line-height:1.06;
  margin-bottom:22px;
  color:#f4f4f7;
}

h1 .dim{
  color:#5a5a68;
}

p.reason{
  font-size:clamp(15px,2vw,18px);
  font-weight:600;
  color:#93939f;
  letter-spacing:.2px;
  line-height:1.6;
}

p.reason b{
  color:#a78bfa;
  font-weight:800;
}

.line{
  width:60px;
  height:2px;
  margin:32px auto 0;
  border-radius:2px;
  background:linear-gradient(90deg,transparent,#3a3a48,transparent);
  opacity:.6;
}

@media (max-width:480px){
  .icon{width:70px;height:70px;border-radius:22px;margin-bottom:24px;}
  .icon svg{width:32px;height:32px;}
  h1{letter-spacing:-1.4px;}
  body::before{
    background:
      radial-gradient(400px 300px at 50% 40%, rgba(124,92,255,.14), transparent 70%);
  }
}
</style>
</head>
<body>

  <div class="box">
    <div class="icon">
      <svg viewBox="0 0 24 24">
        <path d="M12 2 L20 5 V12 C20 17 16 21 12 22 C8 21 4 17 4 12 V5 Z"/>
        <line x1="5" y1="5" x2="19" y2="19"/>
      </svg>
    </div>

    <h1>VPN <span class="dim">закрыт</span></h1>

    <p class="reason">
      Причина — <b>невыгода</b>
    </p>

    <div class="line"></div>
  </div>

</body>
</html>
